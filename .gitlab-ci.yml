stages:
  - verify
  - test
  - secret-detection

default:
  image: node:24
  interruptible: true

verify:
  stage: verify
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run boundaries
    - npm test

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection
