stages:
  - verify
  - test
  - secret-detection
  - build

default:
  interruptible: true

quality:
  stage: verify
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node --version
    - npm --version
    - |
      missing=""
      for name in DATABASE_URL SARVAM_API_KEY; do
        eval "value=\${$name:-}"
        if [ -z "$value" ]; then
          missing="$missing $name"
        fi
      done
      if [ -n "$missing" ]; then
        echo "Missing required CI variables:$missing"
        exit 1
      fi
      echo "Required secret variables are present"
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run boundaries
    - npm run test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-apk:
  stage: build
  image: eclipse-temurin:21-jdk
  needs:
    - job: quality
      artifacts: false
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    ANDROID_HOME: /opt/android-sdk
  before_script:
    - apt-get update
    - apt-get install -y curl unzip nodejs npm git
    - npm ci --cache .npm --prefer-offline
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl --fail --location --retry 5 --retry-delay 3 \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -o /tmp/android-commandline-tools.zip
        unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-commandline-tools
        mv /tmp/android-commandline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null
    - sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - npm run build -w @sauda/web
    - grep -R -q "api.sauda.thedeploymentlab.app" apps/web/dist/assets || (echo "Production API domain missing from web bundle"; exit 1)
    - npm run cap:sync -w @sauda/web
    - cd apps/web/android
    - ./gradlew assembleDebug --no-daemon
    - test -f app/build/outputs/apk/debug/app-debug.apk
    - cp app/build/outputs/apk/debug/app-debug.apk ../../../sauda-debug.apk
  artifacts:
    name: "sauda-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - sauda-debug.apk
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection
