stages:
  - verify
  - test
  - secret-detection
  - build
  - dast

default:
  interruptible: true

include:
  - local: .gitlab/ci/quality.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/dast.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
