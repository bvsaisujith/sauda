# DAST runs against the deployed dash and API, so it only makes sense on the
# default branch after a merge has shipped.
#
# Both scans fail the pipeline. .zap/rules.json decides what is acceptable:
# every Medium/High alert must be fixed, or listed under "allow" with a
# written reason so the exception is a reviewed decision.
#
# Targets are variables, so a preview deployment can be scanned without
# editing this file:
#   DAST_WEB_URL  defaults to the Vercel production URL, which is the same
#                 build served on dash.sauda.thedeploymentlab.app. Point it at
#                 the custom domain once that DNS record is live.
#   DAST_API_URL  defaults to the deployed API.
.zap:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  needs: []
  variables:
    ZAP_WORK: /zap/wrk
    DAST_WEB_URL: https://sauda-dash.vercel.app
    DAST_API_URL: https://api.sauda.thedeploymentlab.app
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dast-reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

zap-web:
  extends: .zap
  script:
    - mkdir -p "$ZAP_WORK" dast-reports
    - python3 tools/dast/wait_for_target.py "$DAST_WEB_URL/" --needle "Sauda" --header "content-security-policy=default-src"
    - cd "$ZAP_WORK"
    - |
      set +e
      zap-baseline.py -t "$DAST_WEB_URL/" -m 3 -T 10 \
        -J zap-web.json -r zap-web.html -w zap-web.md
      echo "zap-baseline exit code: $?"
      set -e
    - cp "$ZAP_WORK"/zap-web.json "$ZAP_WORK"/zap-web.html "$ZAP_WORK"/zap-web.md "$CI_PROJECT_DIR/dast-reports/"
    - cd "$CI_PROJECT_DIR"
    - python3 tools/dast/zap_gate.py dast-reports/zap-web.json --target "$DAST_WEB_URL"

zap-api:
  extends: .zap
  script:
    - mkdir -p "$ZAP_WORK" dast-reports
    - python3 tools/dast/wait_for_target.py "$DAST_API_URL/health" --needle "ok" --header "x-content-type-options=nosniff"
    - cd "$ZAP_WORK"
    - |
      set +e
      zap-baseline.py -t "$DAST_API_URL/health" -m 1 -T 5 \
        -J zap-api.json -r zap-api.html -w zap-api.md
      echo "zap-baseline exit code: $?"
      set -e
    - cp "$ZAP_WORK"/zap-api.json "$ZAP_WORK"/zap-api.html "$ZAP_WORK"/zap-api.md "$CI_PROJECT_DIR/dast-reports/"
    - cd "$CI_PROJECT_DIR"
    - python3 tools/dast/zap_gate.py dast-reports/zap-api.json --target "$DAST_API_URL"
