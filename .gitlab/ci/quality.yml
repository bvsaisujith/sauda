quality:
  stage: verify
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm run boundaries
    - npm run test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
